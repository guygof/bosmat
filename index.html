<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1">
<title>שאלון הכרות — בשמת ברוך · ריפוי בעיסוק</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --teal: #4d9b9b;
    --teal-dark: #2e6b74;
    --coral: #e8837a;
    --bg: #f6f9f9;
    --card: #ffffff;
    --text: #2b3a3e;
    --line: #d7e5e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Assistant', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
  }
  header img {
    width: 240px;
    max-width: 50vw;
    border-radius: 50%;
    box-shadow: 0 2px 10px rgba(46,107,116,.12);
  }
  header h1 {
    color: var(--teal-dark);
    margin: 0.5rem 0 0.25rem;
    font-size: 2rem;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 1rem 1rem 4rem;
  }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    box-shadow: 0 1px 4px rgba(46,107,116,.06);
  }
  label {
    display: block;
    font-weight: 600;
    margin: 1rem 0 0.25rem;
  }
  input[type="text"], input[type="date"], input[type="tel"],
  input[type="email"], input[type="number"], textarea {
    width: 100%;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    background: #fdfdfd;
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--teal);
    border-color: var(--teal);
  }
  textarea { min-height: 5rem; resize: vertical; }
  /* iOS Safari collapses/overlaps native date inputs without explicit sizing */
  input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
    min-height: 2.75rem;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 1rem;
  }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  .checks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0.4rem 1rem;
    margin-top: 0.5rem;
  }
  .checks label {
    font-weight: 400;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .checks input { accent-color: var(--coral); width: 1.1rem; height: 1.1rem; }
  button {
    display: block;
    width: 100%;
    padding: 0.9rem;
    font: inherit;
    font-weight: 700;
    font-size: 1.15rem;
    color: #fff;
    background: var(--teal);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--teal-dark); }
  .required-note { color: var(--coral); font-size: 0.9rem; margin-bottom: 1rem; }
  .subhead { font-weight: 700; color: var(--teal-dark); margin: 1.5rem 0 0; }
  body.rendering button, body.rendering #status, body.rendering .required-note { display: none; }
  /* PDF snapshot: darker, heavier text so it stays legible when printed */
  body.rendering { --text: #000; --teal-dark: #1d4a50; --line: #8fb0b0; background: #fff; }
  body.rendering label { font-weight: 700; }
  body.rendering .checks label { font-weight: 600; }
  body.rendering input, body.rendering textarea { color: #000; font-weight: 600; background: #fff; }
  body.rendering form { box-shadow: none; }
  .req { color: var(--coral); }
</style>
</head>
<body>

<script>
  document.getElementById('fill_date').valueAsDate = new Date();

  document.getElementById('birth_date').addEventListener('change', (e) => {
    const b = e.target.valueAsDate;
    if (!b) return;
    const now = new Date();
    let months = (now.getFullYear() - b.getFullYear()) * 12 + now.getMonth() - b.getMonth();
    if (now.getDate() < b.getDate()) months--;
    if (months < 0) return;
    const y = Math.floor(months / 12), m = months % 12;
    document.getElementById('age').value =
      y === 0 ? `${m} חודשים` : m ? `${y} שנים ו-${m} חודשים` : `${y} שנים`;
  });

  // Compose the answers as one readable RTL letter instead of name-value pairs
  function composeSummary(form) {
    const lines = [];
    let checksDone = false;
    for (const el of form.querySelectorAll('input, textarea')) {
      if (el.type === 'hidden' || el.type === 'file') continue;
      if (el.type === 'checkbox') {
        if (checksDone) continue;
        checksDone = true;
        const checked = [...form.querySelectorAll('.checks input:checked')].map(c => c.value);
        if (checked.length) lines.push('חששות שסומנו: ' + checked.join(', '), '');
        continue;
      }
      if (!el.value.trim()) continue;
      let q = form.querySelector(`label[for="${el.id}"]`).firstChild.textContent.trim();
      if (el.id.startsWith('p1_')) q = 'הורה 1 — ' + q;
      else if (el.id.startsWith('p2_')) q = 'הורה 2 — ' + q;
      let v = el.value.trim();
      if (el.type === 'date') v = new Date(el.value).toLocaleDateString('he-IL');
      const sep = /[?)]$/.test(q) ? '\n' : ': ';
      lines.push(q + sep + v, '');
    }
    // Email templates render LTR; RTL-embedding marks (U+202B/U+202C) keep each line ordered correctly
    const RLE = '\u202B', PDF = '\u202C';
    return lines.map(l => l ? RLE + l.replace(/\n/g, PDF + '\n' + RLE) + PDF : l).join('\n');
  }

  async function fetchAsDataURI(url) {
    const blob = await (await fetch(url)).blob();
    return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  }

  // Google Fonts CSS with the hebrew+latin font files inlined, so the SVG snapshot can use them offline
  let fontCssPromise;
  function getFontCss() {
    fontCssPromise ??= (async () => {
      const css = await (await fetch(document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]').href)).text();
      const blocks = css.match(/\/\* [a-z-]+ \*\/\s*@font-face\s*\{[^}]+\}/g) || [];
      let out = blocks.filter(b => /\/\* (hebrew|latin) \*\//.test(b)).join('\n');
      for (const u of new Set([...out.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))) {
        out = out.split(u).join(await fetchAsDataURI(u));
      }
      return out;
    })();
    return fontCssPromise;
  }

  // Snapshot the filled page into an A4 PDF via SVG foreignObject (native browser
  // rendering — correct Hebrew bidi, unlike html2canvas)
  async function generatePdf() {
    const W = 794, S = 2, PAGE_H = Math.round(W * 297 / 210);
    for (const el of form.querySelectorAll('input, textarea')) {
      if (el.type === 'file') continue;
      if (el.type === 'checkbox') el.toggleAttribute('checked', el.checked);
      else if (el.tagName === 'TEXTAREA') el.textContent = el.value;
      else el.setAttribute('value', el.value);
    }
    const fontCss = await getFontCss();
    // lay the live page out at PDF width to measure height and safe page-break lines
    const scrollY = window.scrollY;
    window.scrollTo(0, 0);
    document.body.classList.add('rendering');
    document.body.style.width = W + 'px';
    const H = document.body.scrollHeight;
    const logo = document.querySelector('header img');
    await logo.decode().catch(() => {});
    // relative to the body: on narrow RTL screens the widened body overflows to the left
    const bodyBox = document.body.getBoundingClientRect(), logoRect = logo.getBoundingClientRect();
    const logoBox = { left: logoRect.left - bodyBox.left, top: logoRect.top - bodyBox.top,
      width: logoRect.width, height: logoRect.height };
    // break pages only above a question label (keeps each label + its field together)
    const cuts = [...document.querySelectorAll('label, p')]
      .filter(el => !el.closest('.checks'))
      .map(el => Math.floor(el.getBoundingClientRect().top) - 8)
      .filter(y => y > 0).sort((a, b) => a - b);
    const clone = document.body.cloneNode(true);
    document.body.style.width = '';
    document.body.classList.remove('rendering');
    window.scrollTo(0, scrollY);
    clone.querySelectorAll('script').forEach(s => s.remove());
    // iOS Safari drops <img> inside SVG foreignObject, so the snapshot gets an empty
    // placeholder (keeps layout and shadow) and the logo is drawn onto the canvas directly
    const ph = document.createElement('div');
    ph.setAttribute('style', 'display:inline-block;width:' + logoBox.width + 'px;height:' +
      logoBox.height + 'px;border-radius:50%;background:#fff;box-shadow:' + getComputedStyle(logo).boxShadow);
    clone.querySelector('header img').replaceWith(ph);
    clone.setAttribute('style', 'width:' + W + 'px;margin:0');
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W * S + '" height="' + H * S + '">' +
      '<g transform="scale(' + S + ')"><foreignObject width="' + W + '" height="' + H + '">' +
      '<div xmlns="http://www.w3.org/1999/xhtml" lang="he" dir="rtl">' +
      '<style>' + fontCss + document.querySelector('style').textContent + '</style>' +
      new XMLSerializer().serializeToString(clone) +
      '</div></foreignObject></g></svg>';
    const img = new Image();
    await new Promise((ok, bad) => {
      img.onload = ok; img.onerror = bad;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
    const pdf = new jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    let y = 0, first = true;
    while (y < H) {
      let end = Math.min(y + PAGE_H, H);
      if (end < H) {
        const safe = cuts.filter(c => c > y + 200 && c < y + PAGE_H);
        if (safe.length) end = safe[safe.length - 1];
      }
      const c = document.createElement('canvas');
      c.width = W * S; c.height = (end - y) * S;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, y * S, c.width, c.height, 0, 0, c.width, c.height);
      if (first) {
        ctx.save();
        ctx.beginPath();
        ctx.arc((logoBox.left + logoBox.width / 2) * S, (logoBox.top + logoBox.height / 2) * S,
          Math.min(logoBox.width, logoBox.height) / 2 * S, 0, 2 * Math.PI);
        ctx.clip();
        ctx.drawImage(logo, logoBox.left * S, logoBox.top * S, logoBox.width * S, logoBox.height * S);
        ctx.restore();
      }
      if (!first) pdf.addPage();
      first = false;
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, (end - y) / PAGE_H * 297);
      y = end;
    }
    return pdf.output('blob');
  }

  const form = document.querySelector('form');
  const status = document.getElementById('status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    status.style.color = 'var(--teal-dark)';
    status.textContent = 'שולח…';
    try {
      const pdfBlob = await generatePdf();
      document.getElementById('f_subject').value = 'שאלון הכרות — ' + document.getElementById('child_name').value.trim();
      document.getElementById('f_replyto').value =
        document.getElementById('p1_email').value.trim() || document.getElementById('p2_email').value.trim();
      document.getElementById('f_summary').value = composeSummary(form);
      const dt = new DataTransfer();
      dt.items.add(new File([pdfBlob], 'intake-form.pdf', { type: 'application/pdf' }));
      document.getElementById('f_attachment').files = dt.files;
      // native multipart POST into a hidden iframe — the AJAX endpoint drops attachments
      const sink = document.getElementById('submit-sink');
      const done = new Promise((ok, bad) => {
        sink.onload = ok;
        setTimeout(() => bad(new Error('timeout')), 30000);
      });
      form.submit();
      await done;
      status.textContent = 'השאלון נשלח בהצלחה, תודה רבה!';
      form.querySelectorAll('input, textarea, button').forEach(el => el.disabled = true);
      status.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) {
      document.body.classList.remove('rendering');
      btn.disabled = false;
      status.style.color = 'var(--coral)';
      status.textContent = 'השליחה נכשלה, אנא נסו שוב.';
      status.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
</script>
</body>
</html>
